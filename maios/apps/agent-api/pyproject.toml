[project]
name = "maios-agent-api"
version = "0.1.0"
description = "MAIOS agent runtime, retrieval, and model gateway services (plan section 10)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
