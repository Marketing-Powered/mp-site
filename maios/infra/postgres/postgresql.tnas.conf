# PostgreSQL 16 configuration tuned for the TNAS HDD pool (ADR-0002, Option B).
# Assumptions: mirrored/RAID HDD pool (no SSD), ~4 GB RAM budget for Postgres,
# Phase 1 volumes (internal sales + one pilot tenant). Revisit triggers in ADR-0002.

listen_addresses = '*'          # container network only; port is NOT published off-box
max_connections = 60            # services use pooled connections; keep this low on HDD

# ── Memory ────────────────────────────────────────────────────────────────────
shared_buffers = 1GB
effective_cache_size = 3GB      # pool ARC/page cache helps reads even on HDD
work_mem = 16MB
maintenance_work_mem = 256MB

# ── HDD-aware planner ─────────────────────────────────────────────────────────
random_page_cost = 4.0          # spinning disks: random IO is expensive; favors index+sort plans that stream
effective_io_concurrency = 2    # HDDs cannot service deep IO queues

# ── WAL / durability ──────────────────────────────────────────────────────────
# Canonical lead capture SLO is 99.9% durable capture — synchronous_commit stays ON.
synchronous_commit = on
wal_compression = lz4
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB              # larger ceiling = fewer, smoother checkpoints on HDD
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9   # spread checkpoint writes; avoids IO storms

# ── Background writer (gentle, HDD-friendly) ──────────────────────────────────
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100

# ── Autovacuum (keep dead tuples from bloating HDD-resident tables) ──────────
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10ms  # throttled so vacuum never saturates the pool

# ── Logging / observability (§14) ─────────────────────────────────────────────
logging_collector = off              # docker json-file logging captures stderr
log_min_duration_statement = 500ms   # matches the 500ms p95 API target — log breaches
log_checkpoints = on
log_autovacuum_min_duration = 10s
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d app=%a '

# ── Statistics for the drift/health dashboards ────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on
